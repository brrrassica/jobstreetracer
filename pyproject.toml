[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "jobstreetracer"
version = "0.1.0"
description = "Polite JobStreet Indonesia job scraper with cron scheduling and Telegram notifications"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "curl_cffi>=0.7",
    "beautifulsoup4>=4.12",
    "APScheduler>=3.10,<4",
    "python-dotenv>=1.0",
    "rich>=13",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]
research = ["apify-client>=3"]

[project.scripts]
jobstreetracer = "jobstreetracer.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W"]
